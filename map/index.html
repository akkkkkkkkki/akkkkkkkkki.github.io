<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8e2d6">
  <title>Walking Map</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="assets/map.css">
</head>
<body>
  <div id="app" data-theme="warm">
    <div id="map" aria-label="上海地点地图"></div>

    <a class="icon-button corner-home" href="/" aria-label="返回博客" title="返回博客">
      <svg aria-hidden="true"><use href="#icon-back"></use></svg>
    </a>

    <nav class="tool-dock" aria-label="地图工具">
      <button class="icon-button is-active" id="view-button" aria-label="切换地图与手账" aria-pressed="false" title="地图 / 手账">
        <svg aria-hidden="true"><use href="#icon-map"></use></svg>
      </button>
      <button class="icon-button" id="filter-button" aria-label="筛选与标签" aria-expanded="false" title="筛选与标签">
        <svg aria-hidden="true"><use href="#icon-filter"></use></svg>
        <span class="button-dot" id="filter-dot" hidden></span>
      </button>
      <button class="icon-button" id="collection-button" aria-label="命名点集" aria-expanded="false" title="命名点集">
        <svg aria-hidden="true"><use href="#icon-network"></use></svg>
      </button>
      <button class="icon-button" id="contribute-button" aria-label="投稿" aria-expanded="false" title="投稿">
        <svg aria-hidden="true"><use href="#icon-pin-plus"></use></svg>
      </button>
      <button class="icon-button" id="theme-button" aria-label="切换昼夜主题" title="昼 / 夜">
        <svg aria-hidden="true"><use href="#icon-moon"></use></svg>
      </button>
      <button class="icon-button" id="info-button" aria-label="地图信息" aria-expanded="false" title="地图信息">
        <svg aria-hidden="true"><use href="#icon-info"></use></svg>
        <span class="button-dot error-dot" id="error-dot" hidden></span>
      </button>
    </nav>

    <div class="map-switch-wrap">
      <div class="map-switch-menu" id="map-switch-menu" hidden></div>
      <button class="icon-button map-switch-button" id="map-switch-button" aria-label="切换城市" aria-expanded="false" title="切换城市">
        <svg aria-hidden="true"><use href="#icon-map-switch"></use></svg>
      </button>
    </div>

    <aside class="floating-panel" id="filter-panel" aria-label="筛选与标签" hidden>
      <header><h2>筛选</h2><button class="close-button" data-close="filter-panel" aria-label="关闭">×</button></header>
      <fieldset class="category-options">
        <legend>分类</legend>
        <label><input type="checkbox" value="food" checked> <span class="category-mark food"></span>吃喝</label>
        <label><input type="checkbox" value="walk" checked> <span class="category-mark walk"></span>散步</label>
      </fieldset>
      <div class="panel-section"><div class="section-heading"><span>标签</span><button class="text-button" id="clear-filter-button">Clear</button></div><div class="tag-cloud" id="tag-cloud"></div></div>
      <p class="result-count" id="result-count"></p>
    </aside>

    <aside class="floating-panel" id="collections-panel" aria-label="命名点集" hidden>
      <header><h2>点集</h2><button class="close-button" data-close="collections-panel" aria-label="关闭">×</button></header>
      <div id="collection-list" class="choice-list"></div>
    </aside>

    <aside class="floating-panel" id="info-panel" aria-label="地图信息" hidden>
      <header><h2>地图信息</h2><button class="close-button" data-close="info-panel" aria-label="关闭">×</button></header>
      <p>地图数据来自 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap contributors</a>，静态底图由 <a href="https://protomaps.com" target="_blank" rel="noreferrer">Protomaps</a> 工具生成。</p>
      <div id="data-errors" class="data-errors" hidden></div>
      <p class="muted">更多地图待解锁，意见和 idea 欢迎联系：<a href="mailto:1685700675@qq.com">1685700675@qq.com</a></p>
    </aside>

    <aside id="journal-panel" class="journal-panel" aria-label="地点手账" hidden>
      <header><span id="journal-count"></span><button class="close-button" id="journal-close-button" aria-label="返回全屏地图">×</button></header>
      <div id="journal-list" class="journal-list"></div>
    </aside>

    <aside id="details-panel" class="details-panel" aria-label="地点详情" hidden>
      <button class="details-close" id="details-close-button" aria-label="关闭详情">×</button>
      <div id="details-content"></div>
    </aside>

    <aside id="contribute-panel" class="editor-panel contribute-panel" aria-label="投稿" hidden>
      <header><h2>投稿</h2><button class="close-button" id="contribute-close" aria-label="关闭">×</button></header>
      <form id="invite-form">
        <label>Key<input id="invite-key" autocomplete="off" required maxlength="100"></label>
        <div class="compact-actions"><span id="invite-status" class="field-help"></span><button type="submit" class="soft-button" id="verify-key-button">Verify</button></div>
      </form>
      <button type="button" class="text-button apply-key-button" id="show-key-request-button">Apply for a key</button>
      <form id="key-request-form" hidden>
        <label>昵称<input id="key-request-name" required maxlength="40"></label>
        <label>邮箱<input id="key-request-email" type="email" required maxlength="254"></label>
        <label>申请说明（可选）<textarea id="key-request-note" rows="4" maxlength="500"></textarea></label>
        <div class="form-actions request-actions"><button type="button" class="soft-button" id="cancel-key-request-button">Cancel</button><button type="submit" class="primary-button icon-action" id="submit-key-request-button" aria-label="提交申请" title="提交申请">✓</button></div>
      </form>
      <div class="mobile-handoff" id="mobile-handoff" hidden><span id="mobile-handoff-status">手机填写中…</span><button type="button" id="cancel-mobile-draft-button" aria-label="取消手机填写" title="取消手机填写">×</button></div>
      <div id="contribution-fields" hidden>
        <form id="contribution-form">
          <p class="contribution-mode" id="contribution-mode"></p>
          <input id="contribution-lng" type="hidden"><input id="contribution-lat" type="hidden">
          <input id="contribution-place-id" type="hidden">
          <div class="location-picker" id="location-picker"><span id="location-summary">尚未选择位置</span><div class="location-actions"><button type="button" class="soft-button icon-action" id="create-mobile-draft-button" aria-label="扫码填写" title="扫码填写" hidden><svg aria-hidden="true"><use href="#icon-qr"></use></svg></button><button type="button" class="soft-button icon-action" id="choose-location-button" aria-label="在地图上选点" title="在地图上选点"><svg aria-hidden="true"><use href="#icon-pin-plus"></use></svg></button></div></div>
          <div id="contribution-content-fields" hidden>
            <div id="new-place-fields">
              <label>名称<input id="contribution-title" maxlength="80"></label>
              <label>分类<select id="contribution-category"><option value="food">吃喝</option><option value="walk">散步</option></select></label>
              <label>标签<input id="contribution-tags" maxlength="300" placeholder="咖啡，安静，梧桐"></label>
            </div>
            <label>日期（可选）<input id="contribution-date" type="date"></label>
            <label>文字<textarea id="contribution-text" rows="7" required maxlength="5000"></textarea></label>
            <div class="photo-picker-row"><button type="button" class="soft-button icon-action photo-picker-button" id="choose-contribution-photo-button" aria-label="选择照片" title="选择照片"><svg aria-hidden="true"><use href="#icon-image"></use></svg></button><span id="contribution-photo-count">0/4</span><input id="contribution-photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden></div>
            <div id="contribution-photo-list" class="contribution-photo-list"></div>
            <div class="form-actions contribute-actions"><button type="submit" class="primary-button icon-action" id="submit-contribution-button" aria-label="提交" title="提交">✓</button></div>
          </div>
          <div class="mobile-draft-box" id="mobile-draft-box" hidden><canvas id="mobile-draft-qr"></canvas><p id="mobile-draft-status">手机扫码填写</p><small id="mobile-draft-expiry"></small><a id="mobile-draft-link" target="_blank" rel="noreferrer">Open</a></div>
        </form>
      </div>
    </aside>

    <div id="loading" class="status-screen"><div class="loader"></div><p>loading map...</p></div>
    <div id="fatal-error" class="status-screen error-screen" hidden><h1>地图暂时没有展开</h1><p id="fatal-message"></p><button class="primary-button" id="retry-button">Retry</button><a href="/">返回博客</a></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <svg class="svg-defs" aria-hidden="true">
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-map" viewBox="0 0 24 24"><path d="m3 6 5-3 8 3 5-3v15l-5 3-8-3-5 3zM8 3v15M16 6v15"/></symbol>
    <symbol id="icon-map-switch" viewBox="0 0 24 24"><path d="m3 6 5-3 8 3 5-3v14l-5 3-8-3-5 3zM8 3v15M16 6v15"/><path d="M17.5 4.2h4m0 0-1.7-1.7m1.7 1.7-1.7 1.7"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="icon-network" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="14" cy="18" r="2.3"/><path d="m8.3 6.8 7.4-.6M7.4 9l5.2 7M17.1 8.2l-2.1 7.5"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15.3A8.4 8.4 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="icon-pin-plus" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><path d="M12 7v6M9 10h6"/></symbol>
    <symbol id="icon-qr" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v6h-6v-2h4zM14 10v2M10 14h2"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m4 17 4.5-4.5 3.5 3 2.5-2.5L20 18"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 20 4.3-1 10.8-10.8a2 2 0 0 0-2.8-2.8L5.5 16.2 4 20Z"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 20h14"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0 5-5m-5 5-5-5M5 20h14"/></symbol>
  </svg>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/pmtiles.js"></script>
  <script src="vendor/basemaps.js"></script>
  <script src="vendor/qrcode-generator.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/app.mjs?v=20261012-1"></script>
</body>
</html>
