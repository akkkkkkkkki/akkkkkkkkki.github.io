<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8e2d6">
  <title>Walking Map · Add</title>
  <link rel="stylesheet" href="../vendor/maplibre-gl.css">
  <link rel="stylesheet" href="../assets/map.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <main class="mobile-shell" id="mobile-app">
    <header class="mobile-header"><h1>Walking Map</h1><span>Add</span></header>
    <section class="mobile-card" id="mobile-loading"><div class="loader"></div><p>loading...</p></section>
    <section class="mobile-card" id="mobile-error" hidden><h2>无法打开</h2><p id="mobile-error-message"></p></section>
    <section class="mobile-card" id="mobile-complete" hidden><div class="complete-mark">✓</div><h2 id="complete-title">已提交</h2><p id="complete-message"></p></section>
    <form class="mobile-card mobile-form" id="mobile-form" hidden>
      <section class="mobile-location">
        <div class="mobile-label-row"><span>地点</span><button type="button" class="text-button" id="change-location">更改</button></div>
        <p class="location-value" id="mobile-location-value"></p>
        <div class="location-methods" id="location-methods" hidden>
          <button type="button" data-method="locate" aria-label="定位"><svg><use href="#icon-locate"></use></svg><span>定位</span></button>
          <button type="button" data-method="search" aria-label="搜索"><svg><use href="#icon-search"></use></svg><span>搜索</span></button>
          <button type="button" data-method="manual" aria-label="手动选点"><svg><use href="#icon-pin"></use></svg><span>手动</span></button>
        </div>
        <div class="location-search" id="location-search" hidden><input id="place-search-input" maxlength="80" placeholder="店名、商场、公园或道路"><button type="button" id="place-search-button" class="soft-button icon-action" aria-label="搜索">⌕</button></div>
        <div class="search-results" id="search-results" hidden></div>
        <div class="mobile-mini-map" id="mobile-mini-map" hidden></div>
      </section>
      <div id="new-place-mobile-fields">
        <label>名称<input id="mobile-title" maxlength="80" required></label>
        <label>分类<select id="mobile-category"><option value="food">吃喝</option><option value="walk">散步</option></select></label>
        <label>标签<input id="mobile-tags" maxlength="300" placeholder="咖啡，安静，梧桐"></label>
      </div>
      <label>日期（可选）<input id="mobile-date" type="date"></label>
      <label>文字<textarea id="mobile-text" rows="7" required maxlength="5000"></textarea></label>
      <section class="mobile-photos">
        <div class="mobile-label-row"><span>照片（最多 4 张）</span><label class="photo-add" aria-label="从相册选择照片">＋<input id="mobile-photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden></label></div>
        <div class="photo-preview-list" id="mobile-photo-list"></div>
      </section>
      <div class="mobile-submit"><button type="submit" class="primary-button icon-action" id="mobile-submit" aria-label="提交">✓</button></div>
    </form>
    <div class="toast" id="mobile-toast" hidden></div>
  </main>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="icon-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
  </svg>
  <script src="../vendor/maplibre-gl.js"></script><script src="../vendor/pmtiles.js"></script><script src="../vendor/basemaps.js"></script><script src="../config.js"></script>
  <script type="module" src="mobile.mjs?v=20260817-2"></script>
</body>
</html>
